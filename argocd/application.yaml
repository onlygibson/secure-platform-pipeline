# Replace YOUR_GITHUB_USERNAME before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-platform-pipeline
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/onlygibson/secure-platform-pipeline.git
    targetRevision: main
    path: helm/secure-platform-pipeline
  destination:
    server: https://kubernetes.default.svc
    namespace: spp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
