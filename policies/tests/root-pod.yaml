# Test pod for disallow-root-user: does NOT set runAsNonRoot, so it should be BLOCKED.
# Everything else is hardened, so the only thing wrong with it is the root setting.

apiVersion: v1
kind: Pod
metadata:
  name: root-test
  namespace: policy-test
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]  
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
            