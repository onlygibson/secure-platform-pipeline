version: 2
updates:
  # Python packages in app/requirements.txt
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
  
  # Base image in the Dockerfile (python:3.13-slim)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  
  # Actions used in .github/workflows (checkout, cosign-installer, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  
  # Terraform providers (kubernetes, helm, aws)
  - package-ecosystem: "terraform"
    directories:
      - "/terraform/k8s"
      - "/terraform/aws"
    schedule:
      interval: "weekly"