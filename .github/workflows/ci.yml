name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secure-platform-pipeline:${{ github.sha }} .

      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 \
            secure-platform-pipeline:${{ github.sha }}
      
      - name: Scan Dockerfile and Helm charts for HIGH/CRITICAL misconfigurations
        run: |
          docker run --rm -v "$PWD":/src \
            aquasec/trivy:latest config --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Start app
        run: docker run -d --name app -p 8080:8080 secure-platform-pipeline:${{ github.sha }}
      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --format cyclonedx --quiet \
            secure-platform-pipeline:${{ github.sha }} > sbom.json

      - name: Upload SBOM as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 30
      - name: Health check
        run: |
          curl -sf --retry 20 --retry-all-errors --retry-delay 1 \
            localhost:8080/health | grep -q '"status":"ok"'

      - name: Smoke test - config endpoint accepts valid YAML
        run: |
          curl -sf -X POST --data 'a: 1' localhost:8080/config | grep -q '"a":1'

      - name: Security regression - unsafe YAML is rejected
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            --data '!!python/object/apply:os.system ["echo hacked"]' \
            localhost:8080/config)
          echo "Status: $code"
          test "$code" != "200"

      - name: Show app logs on failure
        if: failure()
        run: docker logs app

  publish-and-sign:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ steps.push.outputs.digest }}"